<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konri’s Team — FNF Mods</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b1a2b;--box:#13283f;--box2:#1b3654;--line:#3b6a9c;--text:#d8e6f5;--org:#ff9900;--yel:#ffe14d;--red:#c8102e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg) repeating-linear-gradient(45deg,#112c4d 0 6px,#0b1a2b 6px 12px);background-size:16.97px 16.97px;animation:bgm 1.5s linear infinite;color:var(--text);font:13px/1.45 Verdana,Tahoma,Arial,sans-serif}
a{color:var(--yel)}a:hover{color:#fff;background:var(--red)}
#wrap{max-width:900px;margin:0 auto;padding:8px}
#head{background:linear-gradient(#2a5a8f,#10253d);border:2px solid var(--line);border-radius:8px 8px 0 0;display:flex;align-items:center;gap:14px;padding:10px 14px}
#head img{width:72px;height:72px;border:2px solid #fff;border-radius:50%;background:#000}
#head h1{margin:0;font:bold 30px Impact,'Arial Black',sans-serif;color:var(--org);text-shadow:2px 2px 0 #000,-1px -1px 0 #7a3b00;letter-spacing:1px}
#head small{color:var(--yel);display:block;font-size:12px}
#nav{background:var(--org);border:2px solid var(--line);border-top:0;display:flex;flex-wrap:wrap}
#nav a{color:#000;font-weight:bold;text-decoration:none;padding:5px 14px;border-right:1px solid #8a4b00;text-transform:uppercase;font-size:12px}
#nav a:hover{background:#000;color:var(--org)}
#cols{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
#side{width:200px;flex:none}
#main{flex:1;min-width:0}
.box{background:var(--box);border:2px solid var(--line);margin-bottom:8px}
.box h2{margin:0;background:linear-gradient(#ffb43a,#e07800);color:#000;font-size:13px;padding:3px 8px;text-transform:uppercase;border-bottom:2px solid #7a3b00}
.box .in{padding:8px}
.box ul{margin:0;padding-left:16px}
.hit{font:bold 18px 'Courier New',monospace;background:#000;color:#3f3;text-align:center;padding:4px;border:2px inset #555;letter-spacing:4px}
.news{border-bottom:1px dashed var(--line);padding:6px 0}
.news:last-child{border:0}
.news b{color:var(--yel)}.news i{color:#8fb4d8;font-size:11px}
.new{background:var(--red);color:#fff;font-size:10px;padding:0 4px;font-weight:bold;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#ban{width:100%;display:block;border:2px solid #000;outline:2px solid var(--org)}
.ver{display:inline-block;background:#000;color:var(--org);border:1px solid var(--org);padding:0 6px;font:bold 12px 'Courier New',monospace}
.cr{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.cr div{background:var(--box2);border:1px solid var(--line);padding:5px 8px}
.cr h3{margin:0 0 3px;color:var(--org);font-size:12px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.dl{display:block;text-align:center;background:linear-gradient(#777,#444);color:#ccc;border:3px outset #999;padding:10px;font:bold 16px Verdana;cursor:not-allowed}
.sc{background:#000;border:1px solid var(--line);padding:4px 8px;color:var(--yel);overflow:hidden;white-space:nowrap}
.sc span{display:inline-block;padding-left:100%;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
#foot{text-align:center;color:#8fb4d8;font-size:11px;padding:10px}
@media(max-width:640px){#cols{flex-direction:column}#side{width:100%}#head h1{font-size:22px}}
#head{position:relative}
#lang{margin-left:auto;display:flex;gap:4px}
#lang button{font:bold 12px Verdana;background:#10253d;color:var(--yel);border:2px outset #6a9fd0;padding:3px 9px;cursor:pointer}
#lang button.on{background:var(--org);color:#000;border-style:inset}
#gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.sh{margin:0;background:#000;border:2px solid var(--line);padding:3px}
.sh img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;cursor:pointer}
.sh.empty div{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font:bold 14px 'Courier New',monospace;color:#888;background:repeating-linear-gradient(90deg,#c33 0 14%,#cc3 0 28%,#3c3 0 42%,#3cc 0 56%,#33c 0 70%,#c3c 0 84%,#ddd 0 100%);text-shadow:1px 1px 0 #000,-1px -1px 0 #000;color:#fff}
.sh figcaption{font-size:11px;color:var(--yel);padding:3px 2px 0;text-align:center}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:pointer}
#lb img{max-width:100%;max-height:80%;border:3px solid var(--org)}#lb p{color:var(--yel)}
.imba{flex:none;margin-left:auto;width:86px;height:86px;display:flex;align-items:center;justify-content:center;background:var(--red);color:var(--yel);font:bold 17px Impact,'Arial Black',sans-serif;transform:rotate(-12deg);animation:pu 1.4s ease-in-out infinite;clip-path:polygon(50% 0,60% 14%,75% 6%,78% 22%,94% 22%,88% 37%,100% 50%,88% 63%,94% 78%,78% 78%,75% 94%,60% 86%,50% 100%,40% 86%,25% 94%,22% 78%,6% 78%,12% 63%,0 50%,12% 37%,6% 22%,22% 22%,25% 6%,40% 14%)}
#head .imba+#lang{margin-left:0}
@keyframes pu{50%{transform:rotate(-5deg) scale(1.12)}}
#head img{transition:transform .4s}#head img:hover{transform:rotate(360deg) scale(1.1)}
#head h1:hover{animation:sk .25s linear infinite}@keyframes sk{25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
.news{transition:background .15s}.news:hover{background:var(--box2)}

.bar{height:12px;border:2px inset #555;background:repeating-linear-gradient(45deg,var(--org) 0 8px,#7a3b00 8px 16px);background-size:22.6px 22.6px;animation:bp 1s linear infinite}
@keyframes bp{to{background-position:22.6px 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes bgm{to{background-position:16.97px 0}}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 90px 120px,var(--yel),transparent),radial-gradient(1px 1px at 160px 60px,#fff,transparent),radial-gradient(2px 2px at 50px 170px,#8fd0ff,transparent);background-size:200px 200px;animation:tw 1.2s steps(2) infinite}
@keyframes tw{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
@media(max-width:640px){#head{flex-wrap:wrap}}
</style>
</head>
